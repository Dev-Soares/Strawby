# Development override: hot-reload for server and Vite dev server for client.
# Run with: docker compose up --build
services:
  server:
    build:
      target: deps
    command: >
      sh -c "pnpm --filter strawby-api exec prisma generate &&
             pnpm --filter strawby-api start:dev"
    ports:
      - "3000:3000"
    volumes:
      - ./server:/app/server
      - /app/server/dist
      - /app/node_modules
      - /app/server/node_modules
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/appdb"
      DIRECT_URL: "postgresql://postgres:postgres@postgres:5432/appdb"
      CORS_ORIGIN: "http://localhost:5173"

  client:
    build:
      target: deps
    command: sh -c "pnpm --filter strawby-client dev --host"
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app/client
      - /app/node_modules
      - /app/client/node_modules
    environment:
      VITE_API_URL: "http://localhost:3000"
