services:
  postgres:
    image: postgres:16-alpine
    container_name: strawby-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - strawby

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
      target: production
    container_name: strawby-server
    restart: unless-stopped
    env_file:
      - server/.env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/appdb"
      DIRECT_URL: "postgresql://postgres:postgres@postgres:5432/appdb"
      CORS_ORIGIN: "http://localhost"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - strawby

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
      target: production
      args:
        VITE_API_URL: "http://localhost:3000"
    container_name: strawby-client
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - server
    networks:
      - strawby

volumes:
  postgres_data:

networks:
  strawby:
    driver: bridge
