<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon-v2.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192-v2.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Strawby" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0a" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-v2.png" />

    <!-- Base SEO (overridden per-page by react-helmet-async) -->
    <title>Strawby - Controle de Refeições e Nutrição Diária</title>
    <meta name="description" content="Strawby é o app de nutrição para acompanhar calorias, macros e refeições do dia a dia. Simples, visual e consistente." />
    <meta name="robots" content="index, follow" />
    <!-- %VITE_SITE_URL% vem do .env e é substituído pelo Vite no build. Nunca escrever
         o domínio à mão aqui: canonical apontando para o domínio errado faz o Google
         tratar o site real como duplicata. -->
    <link rel="canonical" href="%VITE_SITE_URL%/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Strawby" />
    <meta property="og:title" content="Strawby - Controle de Refeições e Nutrição Diária" />
    <meta property="og:description" content="Strawby é o app de nutrição para acompanhar calorias, macros e refeições do dia a dia. Simples, visual e consistente." />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Mascote do Strawby acenando ao lado do nome do app" />
    <meta property="og:locale" content="pt_BR" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Strawby - Controle de Refeições e Nutrição Diária" />
    <meta name="twitter:description" content="Strawby é o app de nutrição para acompanhar calorias, macros e refeições do dia a dia. Simples, visual e consistente." />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-image.png" />
    <meta name="twitter:image:alt" content="Mascote do Strawby acenando ao lado do nome do app" />

    <!-- JSON-LD Organization (global) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Strawby",
      "url": "%VITE_SITE_URL%",
      "logo": "%VITE_SITE_URL%/logo.webp",
      "description": "App de nutrição para acompanhar calorias, macros e refeições do dia a dia."
    }
    </script>

    <!-- Fontes self-hosted (@font-face em src/index.css). Preload so dos dois
         pesos presentes em toda pagina: corpo e titulo. -->
    <link rel="preload" href="/fonts/satoshi-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/cabinet-grotesk-900.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
